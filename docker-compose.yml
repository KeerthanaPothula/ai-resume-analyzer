version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: resume_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resumeuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resumepass}
      POSTGRES_DB: ${POSTGRES_DB:-resumedb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumeuser -d resumedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume_backend
    environment:
      DATABASE_URL: postgresql://resumeuser:resumepass@db:5432/resumedb
      SECRET_KEY: ${SECRET_KEY:-supersecretkey123456789abcdef}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resume_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
