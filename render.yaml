services:
  - type: web
    name: recruitai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recruitai-db
          property: connectionString

      # Auto-generated by Render on first deploy — never needs to be set manually
      - key: SECRET_KEY
        generateValue: true

      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      # Update this to your Vercel frontend URL in the Render dashboard after deploying the frontend
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app

      # Set to "gemini" or "openai" and add the matching key below to enable AI feedback
      - key: LLM_PROVIDER
        value: none
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # SMTP — optional; password reset links print to logs when not configured
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAILS_FROM_EMAIL
        sync: false
      - key: EMAILS_FROM_NAME
        value: RecruitAI

      # Keeps the sentence-transformers model in the path baked into the Docker image
      - key: TRANSFORMERS_CACHE
        value: /app/.cache/huggingface

databases:
  - name: recruitai-db
    databaseName: resumedb
    user: resumeuser
    plan: free
