# Render deployment configuration — https://render.com/docs/render-yaml-spec
#
# Deploy steps:
#   1. Push this repo to GitHub
#   2. In Render dashboard → New → Blueprint → connect the repo
#   3. Render reads this file and creates the web service + database automatically
#   4. Set the secret env vars in the Render dashboard (SECRET_KEY, API keys, SMTP)
#   5. After the first deploy, set FRONTEND_URL to your Vercel URL and redeploy

services:
  - type: web
    name: recruitai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Render free tier: 512 MB RAM — sufficient for this app
    plan: free
    # Persistent disk for uploaded resume files.
    # NOTE: The free plan does not include a disk — upgrade to Starter ($7/mo)
    # or switch to cloud storage (S3/Cloudinary) for persistent uploads.
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      # Injected automatically by Render from the linked database
      - key: DATABASE_URL
        fromDatabase:
          name: recruitai-db
          property: connectionString

      # REQUIRED — generate with: python -c "import secrets; print(secrets.token_hex(32))"
      # Set this in the Render dashboard under Environment; do NOT put in this file.
      - key: SECRET_KEY
        sync: false

      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7

      # Set this to your Vercel frontend URL after first deploy (e.g. https://recruitai.vercel.app)
      # This also auto-allows it in CORS.
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app   # CHANGE THIS

      # AI feedback — set to "gemini" or "openai" and supply the key below
      - key: LLM_PROVIDER
        value: none
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # SMTP email — optional; reset links print to logs if not set
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAILS_FROM_EMAIL
        sync: false
      - key: EMAILS_FROM_NAME
        value: RecruitAI

      # Model cache — keep baked-in cache path consistent
      - key: TRANSFORMERS_CACHE
        value: /app/.cache/huggingface

databases:
  - name: recruitai-db
    databaseName: resumedb
    user: resumeuser
    plan: free
