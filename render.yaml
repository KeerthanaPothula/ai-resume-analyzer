services:
  - type: web
    name: recruitai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recruitai-db
          property: connectionString

      # ── Security ──────────────────────────────────────────────────────────────
      # Auto-generated by Render on first deploy — never needs to be set manually
      - key: SECRET_KEY
        generateValue: true

      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      # ── CORS / Frontend URL ───────────────────────────────────────────────────
      # Controls CORS preflight allow-list AND the base URL in verification/reset emails.
      # Set this to the stable Vercel production URL (no trailing slash).
      # After changing this value you MUST redeploy on Render for it to take effect.
      - key: FRONTEND_URL
        value: https://ai-resume-analyzer-nine-peach.vercel.app

      # Add extra Vercel preview/deployment URLs here (comma-separated, no JSON).
      # Each new Vercel deploy creates a unique URL — add it here so it passes CORS.
      - key: EXTRA_CORS_ORIGINS
        value: https://ai-resume-analyzer-keerthanapothulas-projects.vercel.app,https://ai-resume-analyzer-mj4fwaqc4-keerthanapothulas-projects.vercel.app

      # ── App ───────────────────────────────────────────────────────────────────
      - key: DEBUG
        value: "False"

      # Return verify/reset URLs in API responses when email delivery fails.
      - key: EMAIL_FALLBACK_ENABLED
        value: "true"

      # ── Embedding model (SentenceTransformer / PyTorch) ───────────────────────
      # PyTorch consumes ~300 MB at import time, which exceeds Render free tier
      # (512 MB). Keep this "false" unless you upgrade to a paid Render plan.
      # Set to "true" to enable full semantic-similarity ATS scoring.
      - key: ENABLE_EMBEDDINGS
        value: "false"

      # ── AI / LLM Feedback ─────────────────────────────────────────────────────
      # Set LLM_PROVIDER to "gemini" or "openai" and supply the matching key below.
      # Leave as "none" to use template-based feedback (free, no external calls).
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

      # ── Email transport — Resend (https://resend.com) ────────────────────────
      #
      # Free tier: 3 000 emails/month. No custom domain required for testing.
      # Without EMAIL_FROM set, uses onboarding@resend.dev (sandbox mode —
      # delivers to the Resend account owner only). For full delivery, verify
      # your domain at https://resend.com/domains and set EMAIL_FROM below.
      #
      # Setup:
      #   1. Sign up at https://resend.com → API Keys → Create API Key
      #   2. Set RESEND_API_KEY to the re_... value (Render → Environment → Add)
      #   3. (Production) Add your domain → verify DNS → set EMAIL_FROM
      - key: RESEND_API_KEY
        sync: false
      # Sender address on your verified Resend domain.
      # Example: noreply@yourdomain.com
      # Leave unset to use onboarding@resend.dev (sandbox — account owner only).
      - key: EMAIL_FROM
        sync: false

      - key: EMAILS_FROM_NAME
        value: RecruitAI

      # ── HuggingFace model cache ───────────────────────────────────────────────
      # Keeps the sentence-transformers model in the path baked into the Docker image.
      - key: TRANSFORMERS_CACHE
        value: /app/.cache/huggingface

databases:
  - name: recruitai-db
    databaseName: resumedb
    user: resumeuser
    plan: free
