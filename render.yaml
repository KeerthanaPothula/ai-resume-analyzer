services:
  - type: web
    name: recruitai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recruitai-db
          property: connectionString

      # ── Security ──────────────────────────────────────────────────────────────
      # Auto-generated by Render on first deploy — never needs to be set manually
      - key: SECRET_KEY
        generateValue: true

      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      # ── CORS / Frontend URL ───────────────────────────────────────────────────
      # REQUIRED: Update this to your actual Vercel frontend URL after deploying
      # the frontend. This value controls CORS and email verification/reset links.
      # Example: https://recruitai-abc123.vercel.app
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app

      # Optional: comma-separated extra origins (no JSON escaping needed)
      # Use this if you have preview deployments or a custom domain.
      # Example: https://recruitai.com,https://www.recruitai.com
      - key: EXTRA_CORS_ORIGINS
        value: ""

      # ── App ───────────────────────────────────────────────────────────────────
      - key: DEBUG
        value: "False"

      # ── AI / LLM Feedback ─────────────────────────────────────────────────────
      # Set LLM_PROVIDER to "gemini" or "openai" and supply the matching key below.
      # Leave as "none" to use template-based feedback (free, no external calls).
      - key: LLM_PROVIDER
        value: none
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # ── SMTP Email ────────────────────────────────────────────────────────────
      # Optional. When not set, password-reset and verification URLs are printed
      # to the Render log instead of being emailed.
      #
      # Gmail setup:
      #   1. Enable 2-Step Verification on your Google account
      #   2. Go to: https://myaccount.google.com/apppasswords
      #   3. Generate a 16-char App Password and use it as SMTP_PASSWORD
      #
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAILS_FROM_EMAIL
        sync: false
      - key: EMAILS_FROM_NAME
        value: RecruitAI

      # ── HuggingFace model cache ───────────────────────────────────────────────
      # Keeps the sentence-transformers model in the path baked into the Docker image.
      - key: TRANSFORMERS_CACHE
        value: /app/.cache/huggingface

databases:
  - name: recruitai-db
    databaseName: resumedb
    user: resumeuser
    plan: free
